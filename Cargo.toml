[workspace]
members = [
    "crates/caelix-core",
    "crates/caelix",
    "crates/caelix-actix",
    "crates/caelix-axum",
    "crates/caelix-socketio",
    "crates/caelix-macros",
    "crates/caelix-microservices",
    "crates/caelix-cli",
]
resolver = "3"

[workspace.dependencies]
actix-http = { version = "3.13.1", default-features = false }
anyhow = "1.0.104"
async-nats = "0.50.0"
axum = "0.8.9"
base64 = "0.23.0"
bytes = "1.12.1"
bytestring = "1.5.1"
clap = "4.6.4"
ctrlc = "3.5.2"
dotenvy = "0.15.7"
futures-core = "0.3.33"
futures-sink = "0.3.33"
futures-util = { version = "0.3.33", default-features = false }
http-body-util = "0.1.4"
infer = "0.22.0"
ipnet = "2.11.0"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
num_cpus = "1.17.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23.41", default-features = false }
serde = "1.0.229"
serde_html_form = "0.4.1"
serde_json = "1.0.151"
serde_plain = "1.0.2"
sha2 = "0.11.0"
syn = "3.0.3"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", default-features = false }
toml_edit = "0.25.13"
tower-http = "0.7.0"
tracing-subscriber = "0.3.23"
trybuild = "1.0.118"
uuid = "1.24.0"
validator = "0.21.0"
