[package]
name = "caelix-macros"
version = "0.0.18"
edition = "2024"
description = "Procedural macros for the Caelix framework."
license = "MIT"
repository = "https://github.com/Ohanronnie/caelix"
homepage = "https://ohanronnie.github.io/caelix/"
documentation = "https://docs.rs/caelix-macros"
readme = "README.md"

[lib]
proc-macro = true

[features]
default = ["actix", "uploads"]
actix = []
axum = []
openapi = []
uploads = []
microservices = []
tokio = []

[dev-dependencies]
actix-web = "4.14.0"
caelix-actix = { path = "../caelix-actix", version = "0.0.25", features = ["uploads"] }
caelix-core = { path = "../caelix-core", version = "0.0.22", features = ["uploads"] }
serde = { workspace = true, features = ["derive"] }
trybuild.workspace = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }
