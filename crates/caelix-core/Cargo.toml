[package]
name = "caelix-core"
version = "0.0.22"
edition = "2024"
description = "Core primitives for the Caelix framework."
license = "MIT"
repository = "https://github.com/Ohanronnie/caelix"
homepage = "https://ohanronnie.github.io/caelix/"
documentation = "https://docs.rs/caelix-core"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []
sqlx = ["dep:sqlx"]
validator = ["dep:validator"]
openapi = ["dep:utoipa"]
uploads = ["dep:infer", "dep:multer"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
cookie = { version = "0.18.1", features = ["percent-encode"] }
crossbeam-channel = "0.5.16"
futures-core.workspace = true
futures-util = { workspace = true, default-features = false, features = ["std"] }
http = "1.4.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_html_form.workspace = true
sqlx = { workspace = true, optional = true, default-features = false }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tracing = "0.1.44"
tracing-subscriber.workspace = true
validator = { version = "0.20", optional = true }
utoipa = { version = "5.5.0", optional = true }
infer = { workspace = true, optional = true }
multer = { version = "3.1.0", optional = true }
url = "2.5.8"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
trybuild.workspace = true
